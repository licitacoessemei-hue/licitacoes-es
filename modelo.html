<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Licitações ES</title>
<meta name="theme-color" content="#2f343a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--tx:#1f2328;--cz:#3a3f45;--gr:#6a737d;--bg:#f2f3f5;--bd:#d5d9de;--ok:#2e7d32;--warn:#e08e0b;--bad:#c62828}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:#fff;border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
h1{font-size:20px;margin:0}
.sub{color:var(--gr);font-size:13px;margin-top:2px}
.sub.velho{color:var(--tx);font-weight:700}
.aviso{margin:10px 12px 0;padding:10px 12px;border:2px dashed var(--cz);border-radius:8px;background:#fff;font-weight:700;color:var(--tx)}
input[type=search],select{width:100%;min-height:44px;margin-top:10px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:8px;font:16px system-ui;color:var(--tx);background:#fff}
.tabs{position:sticky;top:0;z-index:5;display:flex;background:#fff;border-bottom:2px solid var(--bd);padding-top:env(safe-area-inset-top)}
.tabs button{flex:1 1 0;min-width:0;min-height:54px;padding:4px 2px;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;background:#fff;color:var(--gr);font:600 13px/1.25 system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tabs button small{font:700 13px system-ui;color:var(--gr)}
.tabs button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--cz)}
.tabs button[aria-selected=true] small{color:var(--tx)}
.tag.ok{background:#d7ecd8;color:#1b5e20;font-weight:700}
.intro{margin:12px 14px 0;color:var(--cz);font-size:14px}
.card.fonte{border-left-color:var(--bd)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;min-height:40px;padding:6px 14px;border:1.5px solid var(--bd);border-radius:999px;background:#fff;color:var(--cz);font:600 14px system-ui;white-space:nowrap}
.chip[aria-pressed=true]{background:#dfe3e8;border-color:var(--cz);color:var(--tx)}
.barra{display:flex;gap:10px;align-items:center;padding:6px 12px 0}
.barra select{margin:0;flex:0 0 auto;width:auto;min-height:40px;font-size:14px}
.cont{flex:1;color:var(--gr);font-size:13px}
.card{background:#fff;border:1px solid var(--bd);border-left:6px solid var(--gr);border-radius:10px;margin:10px 12px;padding:12px}
.card.u1{border-left-color:var(--bad)}.card.u2{border-left-color:var(--warn)}.card.u3{border-left-color:var(--ok)}
.topo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#e6e9ed;color:var(--cz)}
.tag.novo{background:#ffe29a;color:var(--tx);font-weight:700}
.tag.ramo{background:#dfe3e8;color:var(--tx);font-weight:600}
.obj{font-weight:600;margin:0 0 6px;overflow-wrap:anywhere}
.obj.cort{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mais{background:none;border:0;padding:4px 0;color:var(--cz);font:600 13px system-ui;text-decoration:underline}
.meta{color:var(--cz);font-size:14px;margin:2px 0;overflow-wrap:anywhere}
.prazo{font-weight:700;margin-top:6px}
.termos{color:var(--gr);font-size:12px;margin-top:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{flex:1 1 40%;min-height:44px;padding:8px 10px;border:1.5px solid var(--cz);border-radius:8px;background:#fff;color:var(--tx);font:600 14px system-ui;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn.on{background:#dfe3e8}
.vazio{margin:40px 20px;text-align:center;color:var(--gr)}
.rodape{margin:18px 14px;color:var(--gr);font-size:12px}
#mais{display:block;width:calc(100% - 24px);margin:12px;min-height:48px;border:1.5px solid var(--cz);border-radius:8px;background:#fff;color:var(--tx);font:700 15px system-ui}
</style>
</head>
<body>
<header>
  <h1 id="titulo">Licitações</h1>
  <div class="sub" id="atualizado"></div>
  <input type="search" id="busca" placeholder="Buscar (objeto, órgão, cidade...)" enterkeyhint="search" autocomplete="off">
</header>
<div id="aviso-exemplo"></div>
<div class="tabs" role="tablist" id="abas"></div>
<div class="chips" id="chips"></div>
<div class="barra" id="barra">
  <span class="cont" id="cont"></span>
  <select id="ordem" aria-label="Ordenar">
    <option value="prazo">Encerra primeiro</option>
    <option value="relev">Mais relevantes</option>
    <option value="valor">Maior valor</option>
    <option value="recente">Mais recentes</option>
  </select>
</div>
<main id="lista"></main>
<button id="mais" hidden>Mostrar mais</button>
<p class="rodape" id="rodape"></p>

<script>
const DADOS = __DADOS_JSON__;
(function(){
"use strict";
const itens = DADOS.itens || [];
const POR_PAGINA = 25;
const ESFERA = {F:"Federal", E:"Estadual", M:"Municipal", D:"Distrital"};
const est = {aba:"rel", q:"", ramos:new Set(), prazo7:false, novas:false, ordem:"prazo", n:POR_PAGINA};

/* armazenamento local (pode não existir em alguns navegadores) */
function lerLS(k, pad){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):pad; }catch(e){ return pad; } }
function gravarLS(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let salvas = lerLS("lic_salvas", {});
est.ordem = lerLS("lic_ordem", "prazo");

/* helpers */
function h(tag, attrs){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){ const v=attrs[k];
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) e.setAttribute(k, v); }
  const add = c => {
    if(c==null||c===false) return;
    if(Array.isArray(c)) { c.forEach(add); return; }
    e.append(c.nodeType?c:document.createTextNode(c));
  };
  for(let i=2;i<arguments.length;i++) add(arguments[i]);
  return e;
}
const semAcento = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const fmtP = new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
function fmtData(d){ const p={}; fmtP.formatToParts(d).forEach(x=>p[x.type]=x.value); return p.day+"/"+p.month+"/"+p.year+" "+(p.hour==="24"?"00":p.hour)+":"+p.minute; }
const dt = s => s ? new Date(s.slice(0,19)+"-03:00") : null;           /* horários da API são de Brasília */
const brl = v => (v==null||v<=1) ? "valor não informado" : new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v);

/* ---------- Google Agenda: abre o evento já preenchido (sem login nem conexão) ---------- */
const fmtC = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
function dtAgenda(d){ const p={}; fmtC.formatToParts(d).forEach(x=>p[x.type]=x.value); return p.year+p.month+p.day+"T"+(p.hour==="24"?"00":p.hour)+p.minute+p.second; }
function linkAgenda(it){
  if(!it._f || it._f.getTime()<=Date.now()) return null;
  const ini = new Date(it._f.getTime()-30*60000);
  const titulo = "Prazo licitação: "+(it.objeto||"sem descrição").slice(0,70).trim()+(it.mun?" – "+it.mun:"");
  const detalhes = [
    it.orgao||it.unidade, it.mun, brl(it.valor)+(it.num?(" · nº "+it.num):""),
    "Prazo para propostas: "+fmtData(it._f), "", (it.url||it.link||""), "",
    "Dica: toque em 'Adicionar notificação' e escolha 1 dia antes para não esquecer."
  ].filter(x=>x!==null&&x!==undefined).join("\n");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent(titulo)
    +"&dates="+dtAgenda(ini)+"/"+dtAgenda(it._f)
    +"&details="+encodeURIComponent(detalhes)
    +"&ctz="+encodeURIComponent("America/Sao_Paulo");
}

/* ---------- outras fontes (atalhos) ---------- */
const FONTES = [
  {nome:"PNCP – Portal Nacional de Contratações Públicas", app:true, url:"https://pncp.gov.br/app/editais",
   desc:"Já alimenta esta lista. Reúne o que prefeituras, estado e União publicam, inclusive de sistemas como Compras.gov.br e Portal de Compras Públicas (aparecem no cartão como \"via ...\")."},
  {nome:"Compras.gov.br (federal)", app:true, url:"https://www.gov.br/compras/pt-br",
   desc:"O que esse sistema envia ao PNCP já aparece aqui. Para participar do pregão, é preciso cadastro no próprio sistema."},
  {nome:"Portal de Compras Públicas", app:true, url:"https://www.portaldecompraspublicas.com.br",
   desc:"Muitas prefeituras usam. O que é enviado ao PNCP já aparece aqui; para dar lances, use o portal."},
  {nome:"Portal de Compras do Governo do ES", app:false, url:"https://compras.es.gov.br",
   desc:"Compras do Governo do Estado (cadastro de fornecedores e consultas de licitações). Confira aqui também."},
  {nome:"SEST SENAT – e-Compras", app:false, url:"https://www.sestsenat.org.br/e-compras",
   desc:"Editais do SEST SENAT. Usa regulamento próprio e publica no próprio site."},
  {nome:"SENAC ES – Licitações", app:false, url:"https://es.senac.br/licitacoes",
   desc:"Editais do Senac no Espírito Santo."},
  {nome:"FINDES / SENAI / SESI – Portal de Compras", app:false, url:"https://portaldecompras.findes.org.br/portal/Mural.aspx",
   desc:"Compras da FINDES, SENAI-ES e SESI-ES. Abre sem login; precisa de JavaScript ligado no navegador."},
  {nome:"Diário Oficial dos Municípios do ES (AMUNES)", app:false, url:"https://www.diariomunicipal.es.gov.br",
   desc:"Avisos de licitação de prefeituras que publicam ali. Use a busca do site com palavras como \"manutenção\" ou \"elétrico\"."},
  {nome:"Diário Oficial do Estado do ES (DIO/ES)", app:false, url:"https://dio.es.gov.br",
   desc:"Caderno de Licitações do Governo do Estado."}
];

function prep(it){
  if(it._p) return it;
  it._p = true; it._f = dt(it.fecha); it._pub = dt(it.pub); it._v = dt(it.visto);
  it._b = semAcento([it.objeto,it.orgao,it.unidade,it.mun,it.num,it.mod,it.origem,(it.ramos||[]).join(" ")].join(" "));
  return it;
}
itens.forEach(prep);
const gerado = dt(DADOS.gerado_em);

function prazo(it){
  const d = it._f;
  if(!d) return {txt:"prazo não informado", cls:"u0", dias:1e9};
  const ms = d - Date.now();
  if(ms<=0) return {txt:"encerrada em "+fmtData(d), cls:"u0", dias:-1};
  const hrs = ms/36e5;
  if(hrs<24){ const hh=Math.floor(hrs); return {txt:"Encerra "+(hh<1?"em menos de 1 h":"em "+hh+" h")+" ("+fmtData(d)+")", cls:"u1", dias:0}; }
  const dd = Math.floor(hrs/24);
  return {txt:"Encerra em "+dd+" dia"+(dd>1?"s":"")+" ("+fmtData(d)+")", cls: dd<=2?"u1":dd<=7?"u2":"u3", dias:dd};
}
const ehNova = it => it._v && gerado && (gerado - it._v) < 36*36e5;

/* ---------- lista filtrada ---------- */
function base(){
  if(est.aba==="sal"){
    return Object.keys(salvas).map(id=>{ const atual=itens.find(i=>i.id===id); return prep(atual||salvas[id]); });
  }
  return est.aba==="rel" ? itens.filter(i=>i.ramos && i.ramos.length) : itens;
}
function filtrar(){
  let L = base();
  if(est.aba==="rel" && est.ramos.size) L = L.filter(i=>i.ramos.some(r=>est.ramos.has(r)));
  const q = semAcento(est.q).split(/\s+/).filter(Boolean);
  if(q.length) L = L.filter(i=>q.every(w=>i._b.indexOf(w)>=0));
  if(est.prazo7) L = L.filter(i=>{ const p=prazo(i); return p.dias>=0 && p.dias<=7; });
  if(est.novas) L = L.filter(ehNova);
  const fim = i => i._f ? i._f.getTime() : 9e15;
  const o = est.ordem;
  L = L.slice().sort((a,b)=>{
    if(o==="valor") return (b.valor||0)-(a.valor||0);
    if(o==="recente") return (b._pub||0)-(a._pub||0);
    if(o==="relev") return (b.score||0)-(a.score||0) || fim(a)-fim(b);
    return fim(a)-fim(b);
  });
  return L;
}

/* ---------- cartão ---------- */
function cartao(it){
  const p = prazo(it);
  const longo = (it.objeto||"").length > 220;
  const obj = h("p",{class:"obj"+(longo?" cort":""),text:it.objeto||"(sem descrição)"});
  const salva = !!salvas[it.id];
  const topo = h("div",{class:"topo"},
    ehNova(it) && h("span",{class:"tag novo",text:"NOVA"}),
    (it.ramos||[]).slice(0,2).map(r=>h("span",{class:"tag ramo",text:r})),
    it.mod && h("span",{class:"tag",text:it.mod}),
    it.sit && it.sit.toLowerCase().indexOf("suspens")>=0 && h("span",{class:"tag novo",text:it.sit}),
    it.srp && h("span",{class:"tag",text:"Registro de preços"}));
  const onde = [it.mun, ESFERA[it.esfera]].filter(Boolean).join(" · ");
  const wa = "https://wa.me/?text="+encodeURIComponent(
    (it.objeto||"").slice(0,200)+"\n"+it.orgao+" – "+it.mun+"\n"+(it._f?("Encerra: "+fmtData(it._f)+"\n"):"")+(it.url||it.link||""));
  const agenda = linkAgenda(it);
  const c = h("article",{class:"card "+p.cls},
    topo, obj,
    longo && h("button",{class:"mais",text:"ver tudo",onclick:ev=>{ const aberto=obj.classList.toggle("cort"); ev.target.textContent=aberto?"ver tudo":"ver menos"; }}),
    h("div",{class:"meta",text:it.orgao||it.unidade}),
    h("div",{class:"meta",text:onde}),
    h("div",{class:"meta",text:brl(it.valor)+(it.num?(" · nº "+it.num):"")+(it.origem?(" · via "+it.origem):"")}),
    h("div",{class:"prazo",text:p.txt}),
    (it.termos&&it.termos.length) && h("div",{class:"termos",text:"Apareceu por: "+it.termos.slice(0,6).join(", ")}),
    h("div",{class:"btns"},
      it.url && h("a",{class:"btn",href:it.url,target:"_blank",rel:"noopener",text:"Abrir no PNCP"}),
      it.link && /^https?:\/\//i.test(it.link) && h("a",{class:"btn",href:it.link,target:"_blank",rel:"noopener",text:"Sistema de origem"}),
      agenda && h("a",{class:"btn",href:agenda,target:"_blank",rel:"noopener",text:"📅 Agenda"}),
      h("button",{class:"btn"+(salva?" on":""),text:salva?"★ Salva":"☆ Salvar",onclick:()=>{
        if(salvas[it.id]) delete salvas[it.id]; else { const cp=Object.assign({},it); delete cp._b; delete cp._p; delete cp._f; delete cp._pub; delete cp._v; salvas[it.id]=cp; }
        gravarLS("lic_salvas", salvas); desenhar(); }}),
      h("a",{class:"btn",href:wa,target:"_blank",rel:"noopener",text:"Enviar no WhatsApp"})));
  return c;
}

/* ---------- desenho ---------- */
const $ = id => document.getElementById(id);
function desenharAbas(){
  const rel = itens.filter(i=>i.ramos && i.ramos.length).length;
  const def = [["rel","Relevantes",rel],["todas","Todas",itens.length],["sal","Salvas",Object.keys(salvas).length],["fon","Fontes",FONTES.length]];
  const box = $("abas"); box.replaceChildren();
  def.forEach(([k,t,n])=>box.append(h("button",{role:"tab","aria-selected":String(est.aba===k),onclick:()=>{est.aba=k;est.n=POR_PAGINA;desenhar();window.scrollTo(0,0);}},
    h("span",{text:t}), h("small",{text:String(n)}))));
}
function desenharFontes(){
  const lista = $("lista");
  lista.append(h("p",{class:"intro",text:"Atalhos para outros portais. Os marcados \"No app\" já alimentam a lista; os de \"Consulta manual\" você abre direto no site e procura por manutenção, elétrico, transformador..."}));
  FONTES.forEach(f=>lista.append(h("article",{class:"card fonte"},
    h("div",{class:"topo"}, h("span",{class:"tag"+(f.app?" ok":""),text:f.app?"No app":"Consulta manual"})),
    h("p",{class:"obj",text:f.nome}),
    h("div",{class:"meta",text:f.desc}),
    h("div",{class:"btns"}, h("a",{class:"btn",href:f.url,target:"_blank",rel:"noopener",text:"Abrir portal"})))));
}
function desenharChips(){
  const box = $("chips"); box.replaceChildren();
  if(est.aba==="sal" || est.aba==="fon"){ box.hidden=true; return; }
  box.hidden=false;
  const mk=(t,on,fn)=>h("button",{class:"chip","aria-pressed":String(on),text:t,onclick:fn});
  box.append(mk("Encerra em 7 dias",est.prazo7,()=>{est.prazo7=!est.prazo7;est.n=POR_PAGINA;desenhar();}));
  box.append(mk("Só novas",est.novas,()=>{est.novas=!est.novas;est.n=POR_PAGINA;desenhar();}));
  if(est.aba==="rel") (DADOS.ramos||[]).forEach(r=>{
    const n = itens.filter(i=>i.ramos&&i.ramos.indexOf(r)>=0).length;
    box.append(mk(r+" ("+n+")",est.ramos.has(r),()=>{ if(est.ramos.has(r)) est.ramos.delete(r); else est.ramos.add(r); est.n=POR_PAGINA; desenhar(); }));
  });
}
function desenhar(){
  desenharAbas(); desenharChips();
  const fon = est.aba==="fon";
  $("busca").hidden = fon; $("barra").hidden = fon;
  if(fon){ $("lista").replaceChildren(); desenharFontes(); $("mais").hidden = true; return; }
  const L = filtrar();
  $("cont").textContent = L.length+" resultado"+(L.length===1?"":"s");
  const lista = $("lista"); lista.replaceChildren();
  if(!L.length){
    lista.append(h("p",{class:"vazio",text: est.aba==="sal" ? "Nenhuma licitação salva. Toque em ☆ Salvar nas que quiser acompanhar." : "Nada encontrado com esses filtros."}));
  } else {
    L.slice(0, est.n).forEach(it=>lista.append(cartao(it)));
  }
  $("mais").hidden = L.length <= est.n;
  $("mais").textContent = "Mostrar mais ("+Math.max(L.length-est.n,0)+" restantes)";
}

/* ---------- cabeçalho / rodapé ---------- */
$("titulo").textContent = "Licitações "+(DADOS.uf||"");
if(gerado){
  const horas = (Date.now()-gerado)/36e5;
  const el = $("atualizado");
  el.textContent = "Atualizado em "+fmtData(gerado)+(horas>=1?" (há "+Math.floor(horas)+" h)":"");
  if(horas>30){ el.classList.add("velho"); el.textContent += " — dados antigos, confira a atualização automática"; }
}
if(DADOS.exemplo) $("aviso-exemplo").append(h("div",{class:"aviso",text:"PRÉVIA COM DADOS FICTÍCIOS: serve só para ver como a tela funciona. Nada aqui é licitação real."}));
$("rodape").textContent = "Fonte: PNCP (Portal Nacional de Contratações Públicas), licitações com propostas abertas em "+(DADOS.uf||"")+". Os filtros por ramo usam palavras-chave e podem errar: confirme sempre no edital e no sistema de origem antes de decidir.";
$("busca").addEventListener("input", e=>{ est.q=e.target.value; est.n=POR_PAGINA; desenhar(); });
$("ordem").value = est.ordem;
$("ordem").addEventListener("change", e=>{ est.ordem=e.target.value; gravarLS("lic_ordem", est.ordem); est.n=POR_PAGINA; desenhar(); });
$("mais").addEventListener("click", ()=>{ est.n+=POR_PAGINA; desenhar(); });

desenhar();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
})();
</script>
</body>
</html>
