<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Licitações ES</title>
<meta name="theme-color" content="#2f343a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{--tx:#1f2328;--cz:#3a3f45;--gr:#6a737d;--bg:#f2f3f5;--bd:#d5d9de;--ok:#2e7d32;--warn:#e08e0b;--bad:#c62828}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(24px + env(safe-area-inset-bottom))}
header{background:#fff;border-bottom:1px solid var(--bd);padding:calc(10px + env(safe-area-inset-top)) 12px 10px}
h1{font-size:20px;margin:0}
.sub{color:var(--gr);font-size:13px;margin-top:2px}
.sub.velho{color:var(--tx);font-weight:700}
.aviso{margin:10px 12px 0;padding:10px 12px;border:2px dashed var(--cz);border-radius:8px;background:#fff;font-weight:700;color:var(--tx)}
input[type=search],select{width:100%;min-height:44px;margin-top:10px;padding:10px 12px;border:1.5px solid var(--bd);border-radius:8px;font:16px system-ui;color:var(--tx);background:#fff}
.tabs{position:sticky;top:0;z-index:5;display:flex;background:#fff;border-bottom:2px solid var(--bd);padding-top:env(safe-area-inset-top)}
.tabs button{flex:1 1 0;min-width:0;min-height:54px;padding:4px 2px;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;background:#fff;color:var(--gr);font:600 13px/1.25 system-ui;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tabs button small{font:700 13px system-ui;color:var(--gr)}
.tabs button[aria-selected=true]{color:var(--tx);border-bottom-color:var(--cz)}
.tabs button[aria-selected=true] small{color:var(--tx)}
.tag.ok{background:#d7ecd8;color:#1b5e20;font-weight:700}
.intro{margin:12px 14px 0;color:var(--cz);font-size:14px}
.card.fonte{border-left-color:var(--bd)}
.ia{margin-top:10px;padding:10px;border:1.5px dashed var(--cz);border-radius:8px;background:#f7f8f9}
.ia .nota{margin:0 0 8px;color:var(--cz);font-size:13px}
.ia .btns{margin-top:0}
.det h4{margin:8px 0 4px;font-size:14px}
.doc{display:block;padding:6px 0;color:var(--tx);font-size:14px;overflow-wrap:anywhere}
.item{padding:6px 0;border-top:1px solid var(--bd);color:var(--cz);font-size:13px;overflow-wrap:anywhere}
.stat{margin-top:6px;font-size:13px;color:var(--cz)}
.stat.erro{color:var(--bad);font-weight:700}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 4px;-webkit-overflow-scrolling:touch}
.chip{flex:0 0 auto;min-height:40px;padding:6px 14px;border:1.5px solid var(--bd);border-radius:999px;background:#fff;color:var(--cz);font:600 14px system-ui;white-space:nowrap}
.chip[aria-pressed=true]{background:#dfe3e8;border-color:var(--cz);color:var(--tx)}
.barra{display:flex;gap:10px;align-items:center;padding:6px 12px 0}
.barra select{margin:0;flex:0 0 auto;width:auto;min-height:40px;font-size:14px}
.cont{flex:1;color:var(--gr);font-size:13px}
.card{background:#fff;border:1px solid var(--bd);border-left:6px solid var(--gr);border-radius:10px;margin:10px 12px;padding:12px}
.card.u1{border-left-color:var(--bad)}.card.u2{border-left-color:var(--warn)}.card.u3{border-left-color:var(--ok)}
.topo{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:#e6e9ed;color:var(--cz)}
.tag.novo{background:#ffe29a;color:var(--tx);font-weight:700}
.tag.ramo{background:#dfe3e8;color:var(--tx);font-weight:600}
.tag.poss{background:#fff;border:1.5px dashed var(--cz);color:var(--tx);font-weight:600}
.doc2{padding:8px 0;border-top:1px solid var(--bd);font-size:14px;overflow-wrap:anywhere}
.doc2:first-of-type{border-top:0}
.doc2 .nome{display:block;color:var(--tx);margin-bottom:4px}
.btns.mini{margin-top:4px;gap:6px}
.btns.mini .btn{flex:1 1 30%;min-height:40px;font-size:13px}
.ia .ok{color:var(--ok);font-weight:700}
.obj{font-weight:600;margin:0 0 6px;overflow-wrap:anywhere}
.obj.cort{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.mais{background:none;border:0;padding:4px 0;color:var(--cz);font:600 13px system-ui;text-decoration:underline}
.meta{color:var(--cz);font-size:14px;margin:2px 0;overflow-wrap:anywhere}
.prazo{font-weight:700;margin-top:6px}
.termos{color:var(--gr);font-size:12px;margin-top:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.btn{flex:1 1 40%;min-height:44px;padding:8px 10px;border:1.5px solid var(--cz);border-radius:8px;background:#fff;color:var(--tx);font:600 14px system-ui;text-align:center;text-decoration:none;display:flex;align-items:center;justify-content:center}
.btn.on{background:#dfe3e8}
.vazio{margin:40px 20px;text-align:center;color:var(--gr)}
.rodape{margin:18px 14px;color:var(--gr);font-size:12px}
#mais{display:block;width:calc(100% - 24px);margin:12px;min-height:48px;border:1.5px solid var(--cz);border-radius:8px;background:#fff;color:var(--tx);font:700 15px system-ui}
#painel-busca{background:#fff;border-bottom:1px solid var(--bd);padding:0 12px 10px}
#painel-busca input[type=search]{margin-top:10px}
#painel-busca select{margin-top:8px;min-height:44px;font-size:15px}
.modo{display:flex;gap:8px;margin-top:10px}
.modo .chip{flex:1 1 0;white-space:normal;text-align:center;line-height:1.2}
.recentes{display:flex;gap:8px;overflow-x:auto;margin-top:8px;padding-bottom:2px}
.recentes:empty{display:none}
.rec-t{flex:0 0 auto;align-self:center;color:var(--gr);font-size:13px}
mark{background:#ffe29a;color:inherit;border-radius:3px;padding:0 1px}
.selbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:44px;margin:0 0 8px;padding:8px 12px;border:1.5px dashed var(--cz);border-radius:8px;background:#fff;color:var(--tx);font:700 15px system-ui}
.selbtn.on{background:var(--cz);color:#fff;border-style:solid}
.card.marcada{box-shadow:0 0 0 3px var(--cz)}
#barra-sel{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid var(--cz);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
#barra-sel .lin{display:flex;gap:8px;align-items:center}
#barra-sel .lin+.lin{margin-top:8px}
#qtd-sel{flex:1;font-weight:700}
#barra-sel .chip{min-height:38px;padding:4px 12px;font-size:13px}
.btn.pri{background:var(--cz);color:#fff;border-color:var(--cz)}
.btn.pri[disabled]{opacity:.45}
body.com-barra{padding-bottom:calc(150px + env(safe-area-inset-bottom))}
#envio{position:fixed;top:0;left:0;right:0;bottom:0;z-index:30;background:rgba(0,0,0,.45);display:flex;align-items:flex-end}
.folha{background:#fff;width:100%;max-height:94vh;overflow:auto;border-radius:14px 14px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom))}
.folha h2{margin:0 0 6px;font-size:18px}
#env-txt{width:100%;min-height:210px;margin-top:8px;padding:10px;border:1.5px solid var(--bd);border-radius:8px;font:14px/1.4 system-ui;color:var(--tx);resize:vertical}
</style>
</head>
<body>
<header>
  <h1 id="titulo">Licitações</h1>
  <div class="sub" id="atualizado"></div>
  <input type="search" id="busca" placeholder="Buscar (objeto, órgão, cidade...)" enterkeyhint="search" autocomplete="off">
</header>
<div id="aviso-exemplo"></div>
<div class="tabs" role="tablist" id="abas"></div>
<section id="painel-busca" hidden>
  <input type="search" id="busca2" placeholder="Palavra-chave (ex.: elevador)" enterkeyhint="search" autocomplete="off">
  <div class="modo" id="modo-busca"></div>
  <select id="mun" aria-label="Município"></select>
  <div class="recentes" id="recentes"></div>
</section>
<div class="chips" id="chips"></div>
<div class="barra" id="barra">
  <span class="cont" id="cont"></span>
  <select id="ordem" aria-label="Ordenar">
    <option value="prazo">Encerra primeiro</option>
    <option value="relev">Mais relevantes</option>
    <option value="valor">Maior valor</option>
    <option value="recente">Mais recentes</option>
  </select>
</div>
<main id="lista"></main>
<div id="barra-sel" hidden>
  <div class="lin"><span id="qtd-sel"></span><button class="chip" id="todas-sel"></button><button class="chip" id="limpar-sel">Limpar</button></div>
  <div class="lin"><button class="btn pri" id="env-sel">Enviar no WhatsApp</button></div>
</div>
<div id="envio" hidden>
  <div class="folha" role="dialog" aria-label="Enviar no WhatsApp">
    <h2>Enviar no WhatsApp</h2>
    <p class="nota" style="margin:0;color:var(--cz);font-size:14px">Confira ou edite a mensagem. Depois toque em <b>Abrir no WhatsApp</b>, escolha o cliente (ou grupo) e envie. Para mandar a outro cliente, toque de novo no botão.</p>
    <textarea id="env-txt" rows="12" aria-label="Mensagem"></textarea>
    <div class="stat" id="env-info"></div>
    <div class="btns" id="env-btns"></div>
    <div class="btns mini"><button class="btn" id="env-copiar">📋 Copiar texto</button><button class="btn" id="env-comp" hidden>📤 Compartilhar</button><button class="btn" id="env-fechar">Fechar</button></div>
    <div class="stat" id="env-aviso" hidden></div>
  </div>
</div>
<button id="mais" hidden>Mostrar mais</button>
<p class="rodape" id="rodape"></p>

<script>
const DADOS = __DADOS_JSON__;
(function(){
"use strict";
const itens = DADOS.itens || [];
const POR_PAGINA = 25;
const ESFERA = {F:"Federal", E:"Estadual", M:"Municipal", D:"Distrital", S:"Sistema S"};
const est = {aba:"rel", q:"", qb:"", modoq:"todas", mun:"", ramos:new Set(), prazo7:false, novas:false, extras:false, soNicho:false, ordem:"prazo", n:POR_PAGINA};

/* armazenamento local (pode não existir em alguns navegadores) */
function lerLS(k, pad){ try{ const v=localStorage.getItem(k); return v?JSON.parse(v):pad; }catch(e){ return pad; } }
function gravarLS(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
let salvas = lerLS("lic_salvas", {});
est.ordem = lerLS("lic_ordem", "prazo");
let buscas = lerLS("lic_buscas", []);
const sel = new Map();                       /* licitações marcadas para enviar (id -> item) */
let modoSel = false, Lcorrente = [];

/* helpers */
function h(tag, attrs){
  const e=document.createElement(tag);
  for(const k in (attrs||{})){ const v=attrs[k];
    if(k==="class") e.className=v;
    else if(k==="text") e.textContent=v;
    else if(k.slice(0,2)==="on") e.addEventListener(k.slice(2), v);
    else if(v!==false && v!=null) e.setAttribute(k, v); }
  const add = c => {
    if(c==null||c===false) return;
    if(Array.isArray(c)) { c.forEach(add); return; }
    e.append(c.nodeType?c:document.createTextNode(c));
  };
  for(let i=2;i<arguments.length;i++) add(arguments[i]);
  return e;
}
const semAcento = s => (s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const fmtP = new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit",hour12:false});
function fmtData(d){ const p={}; fmtP.formatToParts(d).forEach(x=>p[x.type]=x.value); return p.day+"/"+p.month+"/"+p.year+" "+(p.hour==="24"?"00":p.hour)+":"+p.minute; }
const dt = s => s ? new Date(s.slice(0,19)+"-03:00") : null;           /* horários da API são de Brasília */
const brl = v => (v==null||v<=1) ? "valor não informado" : new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v);

const moeda = v => new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(v);
const editalDe = it => (it.arqs && it.arqs.length) ? (it.arqs.find(a=>/edital/i.test(a[1]||"")) || it.arqs[0]) : null;

/* ---------- Google Agenda: abre o evento já preenchido (sem login nem conexão) ---------- */
const fmtC = new Intl.DateTimeFormat("en-CA",{timeZone:"America/Sao_Paulo",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false});
function dtAgenda(d){ const p={}; fmtC.formatToParts(d).forEach(x=>p[x.type]=x.value); return p.year+p.month+p.day+"T"+(p.hour==="24"?"00":p.hour)+p.minute+p.second; }
function linkAgenda(it){
  if(!it._f || it._f.getTime()<=Date.now()) return null;
  const ini = new Date(it._f.getTime()-30*60000);
  const titulo = "Prazo licitação: "+(it.objeto||"sem descrição").slice(0,70).trim()+(it.mun?" – "+it.mun:"");
  const detalhes = [
    it.orgao||it.unidade, it.mun, brl(it.valor)+(it.num?(" · nº "+it.num):""),
    "Prazo para propostas: "+fmtData(it._f), "", (it.url||it.link||""), "",
    "Dica: toque em 'Adicionar notificação' e escolha 1 dia antes para não esquecer."
  ].filter(x=>x!==null&&x!==undefined).join("\n");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE"
    +"&text="+encodeURIComponent(titulo)
    +"&dates="+dtAgenda(ini)+"/"+dtAgenda(it._f)
    +"&details="+encodeURIComponent(detalhes)
    +"&ctz="+encodeURIComponent("America/Sao_Paulo");
}

/* ---------- Perguntar à IA: monta a pergunta e abre o Claude / ChatGPT ---------- */
function perguntaIA(it){
  const ramos = (DADOS.ramos||[]).join(", ");
  return [
    "Estou avaliando participar desta licitação."+(ramos?(" Minha empresa atua em: "+ramos+"."):""),
    "",
    "Objeto: "+(it.objeto||"").slice(0,500),
    "Órgão: "+(it.orgao||it.unidade||"")+(it.mun?(" – "+it.mun):""),
    "Modalidade: "+(it.mod||"não informada")+" | Valor estimado: "+brl(it.valor)+(it._f?(" | Prazo das propostas: "+fmtData(it._f)):""),
    (editalDe(it) ? "Link do edital (PDF): "+editalDe(it)[2] : "Link do edital: "+(it.url||it.link||""))+((editalDe(it)&&it.url&&!it.fonte)?("\nPágina no PNCP: "+it.url):""),
    "",
    "Tente abrir o link e ler o edital. Se não conseguir, me avise que eu anexo o PDF. Depois resuma: o que será contratado, documentos e atestados exigidos para habilitação, prazos, riscos e pontos de atenção. Em seguida, responda às minhas dúvidas sobre o edital."
  ].join("\n");
}
function copiarAntigo(t){
  try{ const ta=document.createElement("textarea"); ta.value=t; ta.setAttribute("readonly",""); ta.style.cssText="position:fixed;top:0;left:0;opacity:0";
    document.body.append(ta); ta.select(); ta.setSelectionRange(0,t.length); const ok=document.execCommand("copy"); ta.remove(); return ok; }catch(e){ return false; }
}
function copiarTexto(t){                     /* devolve uma promessa: true se copiou */
  return new Promise(res=>{
    try{ if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(t).then(()=>res(true),()=>res(copiarAntigo(t))); return; } }catch(e){}
    res(copiarAntigo(t));
  });
}
function copiar(t){ copiarTexto(t); }

/* ---------- abrir FORA do app: dentro do app instalado o PDF do edital costuma travar ---------- */
const naTelaInicial = (function(){ try{ return navigator.standalone===true || matchMedia("(display-mode: standalone)").matches || matchMedia("(display-mode: fullscreen)").matches; }catch(e){ return false; } })();
const ehIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
const ehAndroid = /android/i.test(navigator.userAgent);
function linkFora(url){                      /* endereço que pede ao celular para abrir no navegador, e não dentro do app */
  const m = /^(https?):\/\/(.*)$/i.exec(url||"");
  if(!m || !naTelaInicial) return url;
  if(ehIOS) return "x-safari-"+m[1].toLowerCase()+"://"+m[2];
  if(ehAndroid) return "intent://"+m[2]+"#Intent;scheme="+m[1].toLowerCase()+";action=android.intent.action.VIEW;end";
  return url;
}
function botoesArquivo(url, titulo){
  const aviso = h("div",{class:"stat",hidden:true});
  const mostra = (t, bom) => { aviso.hidden=false; aviso.className="stat"+(bom?" ok":""); aviso.textContent=t; };
  return h("div",null,
    h("div",{class:"btns mini"},
      naTelaInicial && h("a",{class:"btn",href:linkFora(url),rel:"noopener",text:"↗ Abrir no navegador"}),
      h("button",{class:"btn",text:"📋 Copiar link",onclick:()=>{ copiarTexto(url).then(ok=>mostra(ok?"✔ Link copiado. Abra o Safari ou o Chrome, cole na barra de endereço e toque em ir.":"Não consegui copiar. Segure o dedo no botão ‘Abrir aqui’ e escolha Copiar.", ok)); }}),
      (typeof navigator.share==="function") && h("button",{class:"btn",text:"📤 Compartilhar",onclick:()=>{ try{ navigator.share({title:titulo||"Edital",url:url}).catch(()=>{}); }catch(e){} }}),
      h("a",{class:"btn",href:url,target:"_blank",rel:"noopener",text:naTelaInicial?"Abrir aqui (pode travar)":"📄 Abrir"})),
    aviso);
}

/* ---------- edital e itens de licitações que ainda não vieram prontos: busca direto no PNCP (se o PNCP permitir) ---------- */
const RE_PNCP = /^(\d{14})-\d+-(\d+)\/(\d{4})$/;
const API_PNCP = "https://pncp.gov.br/api/pncp/v1/orgaos/";
const podeBuscar = it => !it.fonte && RE_PNCP.test(it.id||"");
function buscarDetalhes(it){
  if(it._det) return it._det;
  const m = RE_PNCP.exec(it.id||"");
  if(!m || it.fonte) return Promise.reject(new Error("sem id"));
  const base = API_PNCP+m[1]+"/compras/"+m[3]+"/"+parseInt(m[2],10);
  const get = u => { const c = (typeof AbortController==="function") ? new AbortController() : null; const t = setTimeout(()=>{ if(c) c.abort(); }, 15000);
    return fetch(u,{signal:c?c.signal:undefined,headers:{Accept:"application/json"}}).then(r=>{ clearTimeout(t); if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); }); };
  it._det = Promise.all([get(base+"/arquivos"), get(base+"/itens?pagina=1&tamanhoPagina=100").catch(()=>[])]).then(r=>{
    const arq = (Array.isArray(r[0])?r[0]:[]).filter(a=>a&&a.url&&a.statusAtivo!==false)
      .sort((a,b)=>((a.tipoDocumentoId!==2)-(b.tipoDocumentoId!==2))||((a.sequencialDocumento||0)-(b.sequencialDocumento||0)));
    const its = Array.isArray(r[1]) ? r[1] : ((r[1]&&(r[1].data||r[1].itens))||[]);
    it.arqs = arq.slice(0,12).map(a=>[String(a.titulo||"Documento").slice(0,90), a.tipoDocumentoNome||"", a.url]);
    it.nitens = its.length;
    it.itens = its.slice(0,40).map(x=>[x.numeroItem, String(x.descricao||"").slice(0,220), x.quantidade, x.unidadeMedida, x.valorUnitarioEstimado]);
    return it;
  });
  it._det.catch(()=>{ it._det = null; });
  return it._det;
}

/* ---------- outras fontes (atalhos) ---------- */
const FONTES = [
  {chave:"PNCP", nome:"PNCP – Portal Nacional de Contratações Públicas", app:true, url:"https://pncp.gov.br/app/editais",
   desc:"Prefeituras, estado e União. Inclui o que vem de sistemas como Compras.gov.br, Licitanet e Portal de Compras Públicas (aparecem no cartão como \"via ...\")."},
  {chave:"SEST SENAT", nome:"SEST SENAT – Portal de Compras", app:true, url:"https://compras.sestsenat.org.br/portal/Mural.aspx",
   desc:"Painel de compras do SEST SENAT no Brasil todo. O app mostra as do ES e as que não informam o local (marcadas \"Confirme o local\")."},
  {chave:"FINDES / SENAI / SESI", nome:"FINDES / SENAI / SESI – Portal de Compras", app:true, url:"https://portaldecompras.findes.org.br/portal/Mural.aspx",
   desc:"Compras da FINDES, SENAI-ES e SESI-ES. Para participar, é preciso cadastro no portal."},
  {chave:"SENAC ES", nome:"SENAC ES – Licitações", app:true, url:"https://es.senac.br/licitacoes",
   desc:"Editais do Senac no Espírito Santo (pregões, concorrências, leilões abertos)."},
  {chave:"Portal de Compras Públicas", nome:"Portal de Compras Públicas (PCP)", app:true, url:"https://www.portaldecompraspublicas.com.br/processos?uf=100132",
   desc:"Processos de prefeituras e órgãos do ES em andamento no PCP. O que o PCP também enviou ao PNCP aparece uma vez só (a versão do PNCP). O texto do objeto vem cortado em cerca de 250 letras: abra o processo no portal para ler inteiro."},
  {nome:"Portal de Compras do Governo do ES", app:false, url:"https://compras.es.gov.br",
   desc:"Compras do Governo do Estado (cadastro de fornecedores e consultas de licitações). Muito do que publicam também aparece no PNCP."},
  {nome:"Diário Oficial dos Municípios do ES (AMUNES)", app:false, url:"https://www.diariomunicipal.es.gov.br",
   desc:"Avisos de licitação de prefeituras que publicam ali. O site não permite leitura automática: use a busca dele com palavras como \"manutenção\" ou \"elétrico\"."},
  {nome:"Diário Oficial do Estado do ES (DIO/ES)", app:false, url:"https://dio.es.gov.br",
   desc:"Caderno de Licitações do Governo do Estado."}
];

function prep(it){
  if(it._p) return it;
  it._p = true; it._f = dt(it.fecha); it._pub = dt(it.pub); it._v = dt(it.visto);
  it._b = semAcento([it.objeto,it.orgao,it.unidade,it.mun,it.num,it.mod,it.origem,(it.ramos||[]).join(" "),(it.possivel||[]).join(" ")].join(" "));
  it._i = semAcento((it.itens||[]).map(x=>(x&&x[1])||"").join(" "));                 /* texto dos itens (quando já foram lidos) */
  it._sb = " "+it._b.replace(/[^a-z0-9]+/g," ")+" ";                                 /* para a aba Busca: palavras separadas por espaço */
  it._si = it._i ? " "+it._i.replace(/[^a-z0-9]+/g," ")+" " : "";
  return it;
}
itens.forEach(prep);
const gerado = dt(DADOS.gerado_em);

function prazo(it){
  const d = it._f;
  if(!d) return {txt:"prazo não informado", cls:"u0", dias:1e9};
  const ms = d - Date.now();
  if(ms<=0) return {txt:"encerrada em "+fmtData(d), cls:"u0", dias:-1};
  const hrs = ms/36e5;
  if(hrs<24){ const hh=Math.floor(hrs); return {txt:"Encerra "+(hh<1?"em menos de 1 h":"em "+hh+" h")+" ("+fmtData(d)+")", cls:"u1", dias:0}; }
  const dd = Math.floor(hrs/24);
  return {txt:"Encerra em "+dd+" dia"+(dd>1?"s":"")+" ("+fmtData(d)+")", cls: dd<=2?"u1":dd<=7?"u2":"u3", dias:dd};
}
const termosVisiveis = it => (it.termos||[]).filter(t=>t.indexOf("re:")!==0);      /* padrões técnicos (re:...) não aparecem para a pessoa */
const ehNova = it => it._v && gerado && it._v <= gerado && (gerado - it._v) < 36*36e5;     /* 'visto' no futuro = fonte lida pela 1ª vez, não é nova */
/* ordem 'mais recentes': fontes sem data de publicação (SENAC, Portal de Compras) usam o dia em que o app as viu; na 1ª leitura ficam no fim */
const chaveRecente = it => { const p=it._pub?+it._pub:0, v=it._v?+it._v:0, g=+gerado;
  if(it.fonte && (!p || p>g)) return (v && v<=g) ? v : 0;
  return p; };

/* ---------- aba Busca: todas as abertas, por palavra-chave ---------- */
const palavrasDe = s => semAcento(s).split(/[^a-z0-9]+/).filter(Boolean);
const temPalavra = (texto, w) => texto.indexOf(" "+w+(w.length<=3?" ":""))>=0;       /* começo de palavra; até 3 letras só palavra inteira */
const achou = (texto, ps) => est.modoq==="qualquer" ? ps.some(w=>temPalavra(texto,w)) : ps.every(w=>temPalavra(texto,w));
const munDe = i => (i.mun||"").replace(/\/[A-Za-z]{2}$/,"").trim();
function realcar(txt, ps){
  const ac = semAcento(txt);
  if(ac.length!==txt.length) return txt;
  const m = new Array(txt.length).fill(false), alfa = c => /[a-z0-9]/.test(c||"");
  ps.forEach(w=>{ let p=0; while((p=ac.indexOf(w,p))>=0){
    if((p===0 || !alfa(ac[p-1])) && (w.length>3 || !alfa(ac[p+w.length]))){ let k=p+w.length; while(alfa(ac[k])) k++; for(let j=p;j<k;j++) m[j]=true; }
    p += w.length; } });
  const out = []; let ini = 0;
  for(let k=1;k<=txt.length;k++) if(k===txt.length || m[k]!==m[ini]){ const t=txt.slice(ini,k); out.push(m[ini]?h("mark",null,t):t); ini=k; }
  return out;
}

/* ---------- lista filtrada ---------- */
const noNicho = i => (i.ramos && i.ramos.length) || (i.possivel && i.possivel.length);
const dosRamos = i => (i.ramos||[]).concat(i.possivel||[]);
function base(){
  if(est.aba==="sal"){
    return Object.keys(salvas).map(id=>{ const atual=itens.find(i=>i.id===id); return prep(atual||salvas[id]); });
  }
  if(est.aba==="busca") return itens;                                  /* Busca = tudo que está aberto no ES */
  if(est.aba==="rel") return itens.filter(i=>i.ramos && i.ramos.length);
  return est.soNicho ? itens.filter(noNicho) : itens;              /* Todas = tudo que está aberto no ES; "Só o meu nicho" reduz a relevantes + possíveis */
}
function filtrar(){
  let L = base();
  if(est.ramos.size && (est.aba==="rel" || est.aba==="todas")) L = L.filter(i=>(est.aba==="rel"?(i.ramos||[]):dosRamos(i)).some(r=>est.ramos.has(r)));
  if(est.aba==="busca"){
    const ps = palavrasDe(est.qb);
    if(ps.length) L = L.filter(i=>achou(i._sb+i._si, ps));
    if(est.mun) L = L.filter(i=>munDe(i)===est.mun);
  } else {
    const q = semAcento(est.q).split(/\s+/).filter(Boolean);
    if(q.length) L = L.filter(i=>q.every(w=>i._b.indexOf(w)>=0));
  }
  if(est.prazo7) L = L.filter(i=>{ const p=prazo(i); return p.dias>=0 && p.dias<=7; });
  if(est.novas) L = L.filter(ehNova);
  if(est.extras) L = L.filter(i=>i.fonte);
  const fim = i => i._f ? i._f.getTime() : 9e15;
  const o = est.ordem;
  L = L.slice().sort((a,b)=>{
    if(o==="valor") return (b.valor||0)-(a.valor||0);
    if(o==="recente") return chaveRecente(b)-chaveRecente(a);
    if(o==="relev") return (b.score||0)-(a.score||0) || fim(a)-fim(b);
    return fim(a)-fim(b);
  });
  return L;
}

function linhaDoc(a){

const LIMITE_LINK = 2600;                                      /* o WhatsApp recusa links muito longos: divido em partes */
function textoDe(it){
  const obj = (it.objeto||"(sem descrição)").replace(/[*_~]/g,"").replace(/\s+/g," ").trim();
  const v = (it.valor!=null && it.valor>1) ? " | "+brl(it.valor) : "";
  return "*"+(obj.length>170 ? obj.slice(0,167).trimEnd()+"…" : obj)+"*\n"
    + [it.orgao||it.unidade, munDe(it)].filter(Boolean).join(" – ")+"\n"
    + (it._f ? "Encerra: "+fmtData(it._f) : "Prazo não informado")+v
    + ((it.url||it.link) ? "\nLink: "+(it.url||it.link) : "");
}
function mensagemSel(){
  const L = Array.from(sel.values()).sort((a,b)=>(a._f?+a._f:9e15)-(b._f?+b._f:9e15));

  const topo = "*Licitações abertas no "+(DADOS.uf||"ES")+"*"+(ramos.length?"\nRamo: "+ramos.join(", "):"")
    +"\n"+L.length+(L.length===1?" licitação":" licitações")+" (consulta de "+fmtData(new Date()).slice(0,10)+")";
  return [topo].concat(L.map((it,i)=>(i+1)+") "+textoDe(it))).join("\n\n");
}
function partesDe(texto){
  const out = []; let cur = "";
  texto.split(/\n{2,}/).forEach(b=>{ const t = cur ? cur+"\n\n"+b : b;
    if(cur && encodeURIComponent(t).length>LIMITE_LINK){ out.push(cur); cur = b; } else cur = t; });
  if(cur.trim()) out.push(cur);
  return out.length>1 ? out.map((t,i)=>(i?"*(continuação "+(i+1)+"/"+out.length+")*\n\n":"")+t) : out;
}

  if(est.aba==="todas"){
    const nn = itens.filter(noNicho).length;
    if(nn < itens.length) box.append(mk("Só o meu nicho ("+nn+")",est.soNicho,()=>{est.soNicho=!est.soNicho;est.n=POR_PAGINA;desenhar();}));
  }
  if(est.aba==="rel" || est.aba==="todas") (DADOS.ramos||[]).forEach(r=>{
    const n = itens.filter(i=>(est.aba==="rel"?(i.ramos||[]):dosRamos(i)).indexOf(r)>=0).length;
    box.append(mk(r+" ("+n+")",est.ramos.has(r),()=>{ if(est.ramos.has(r)) est.ramos.delete(r); else est.ramos.add(r); est.n=POR_PAGINA; desenhar(); }));
  });
}
function desenharRecentes(){
  const rec = $("recentes");
  rec.replaceChildren.apply(rec, (buscas.length && !est.qb.trim()) ? [h("span",{class:"rec-t",text:"Recentes:"})].concat(buscas.map(b=>h("button",{class:"chip",text:b,onclick:()=>{ $("busca2").value=b; est.qb=b; est.n=POR_PAGINA; desenhar(); }}))) : []);
}
function desenharPainelBusca(){
  const modo = $("modo-busca");
  modo.hidden = palavrasDe(est.qb).length < 2;                         /* só faz diferença com 2 palavras ou mais */
  modo.replaceChildren(
    h("button",{class:"chip","aria-pressed":String(est.modoq==="todas"),text:"Todas as palavras",onclick:()=>{est.modoq="todas";est.n=POR_PAGINA;desenhar();}}),
    h("button",{class:"chip","aria-pressed":String(est.modoq==="qualquer"),text:"Qualquer palavra",onclick:()=>{est.modoq="qualquer";est.n=POR_PAGINA;desenhar();}}));
  const cont = {}; itens.forEach(i=>{ const m=munDe(i); if(m) cont[m]=(cont[m]||0)+1; });
  const sel = $("mun"), ops = [h("option",{value:"",text:"Todos os municípios"})];
  Object.keys(cont).sort((a,b)=>a.localeCompare(b,"pt-BR")).forEach(m=>ops.push(h("option",{value:m,text:m+" ("+cont[m]+")"})));
  sel.replaceChildren.apply(sel, ops); sel.value = est.mun;
  desenharRecentes();
}
function desenhar(){
  desenharAbas(); desenharChips();
  const fon = est.aba==="fon", bus = est.aba==="busca";
  $("busca").hidden = fon || bus; $("barra").hidden = fon; $("painel-busca").hidden = !bus;
  if(bus) desenharPainelBusca();
  if(fon){ $("lista").replaceChildren(); desenharFontes(); $("mais").hidden = true; desenharSelecao(); return; }
  const L = filtrar(); Lcorrente = L;
  const filtrando = bus && (palavrasDe(est.qb).length || est.mun);
  $("cont").textContent = bus && !filtrando ? L.length+" abertas no "+(DADOS.uf||"ES") : L.length+" resultado"+(L.length===1?"":"s");
  const lista = $("lista"); lista.replaceChildren();
  if(est.aba==="todas") lista.append(h("p",{class:"intro",text: est.soNicho
    ? "Mostrando só o que combina com o seu nicho: as Relevantes e as marcadas ‘Possível’ (têm só um indício, confira). Toque em ‘Só o meu nicho’ de novo para ver tudo."
    : "Mostrando todas as licitações abertas no ES que o app leu, de qualquer assunto. Para ver só o seu nicho, toque em ‘Só o meu nicho’ ou escolha um ramo."}));
  if(bus && !filtrando) lista.append(h("p",{class:"intro",text:"Todas as licitações abertas no ES que o app leu (PNCP e portais), de qualquer assunto. Digite uma palavra-chave para filtrar: a busca olha objeto, órgão, cidade, número e, quando já foram lidos, os itens."}));
  if(!L.length){
    lista.append(h("p",{class:"vazio",text: est.aba==="sal" ? "Nenhuma licitação salva. Toque em ☆ Salvar nas que quiser acompanhar." : bus ? "Nada encontrado. Tente outra palavra, só o começo dela (ex.: ‘eletric’) ou ‘Qualquer palavra’." : "Nada encontrado com esses filtros."}));
  } else {
    L.slice(0, est.n).forEach(it=>lista.append(cartao(it)));
  }
  desenharSelecao();
  $("mais").hidden = L.length <= est.n;
  $("mais").textContent = "Mostrar mais ("+Math.max(L.length-est.n,0)+" restantes)";
}

/* ---------- cabeçalho / rodapé ---------- */
$("titulo").textContent = "Licitações "+(DADOS.uf||"");
if(gerado){
  const horas = (Date.now()-gerado)/36e5;
  const el = $("atualizado");
  el.textContent = "Atualizado em "+fmtData(gerado)+(horas>=1?" (há "+Math.floor(horas)+" h)":"");
  if(horas>30){ el.classList.add("velho"); el.textContent += " — dados antigos, confira a atualização automática"; }
}
if(DADOS.exemplo) $("aviso-exemplo").append(h("div",{class:"aviso",text:"PRÉVIA COM DADOS FICTÍCIOS: serve só para ver como a tela funciona. Nada aqui é licitação real."}));
$("rodape").textContent = "Fontes: PNCP (licitações com propostas abertas em "+(DADOS.uf||"")+"), Portal de Compras Públicas, SEST SENAT, FINDES/SENAI/SESI e SENAC ES (veja a aba Fontes). Os filtros por ramo usam palavras-chave (e os itens da licitação) e podem errar: confirme sempre no edital e no sistema de origem antes de decidir.";
$("busca").addEventListener("input", e=>{ est.q=e.target.value; est.n=POR_PAGINA; desenhar(); });
$("busca2").addEventListener("input", e=>{ est.qb=e.target.value; est.n=POR_PAGINA; desenhar(); });
$("busca2").addEventListener("keydown", e=>{ if(e.key==="Enter") e.target.blur(); });
$("busca2").addEventListener("change", e=>{ const v=e.target.value.trim();
  if(v.length>=3){ buscas=[v].concat(buscas.filter(x=>x.toLowerCase()!==v.toLowerCase())).slice(0,6); gravarLS("lic_buscas", buscas); setTimeout(desenharRecentes, 400); } });
$("mun").addEventListener("change", e=>{ est.mun=e.target.value; est.n=POR_PAGINA; desenhar(); });
$("env-sel").addEventListener("click", abrirEnvio);
$("limpar-sel").addEventListener("click", ()=>{ sel.clear(); desenhar(); });
$("todas-sel").addEventListener("click", ()=>{ Lcorrente.forEach(it=>sel.set(it.id, it)); desenhar(); });
$("env-txt").addEventListener("input", atualizarEnvio);
$("env-fechar").addEventListener("click", ()=>{ $("envio").hidden = true; });
$("envio").addEventListener("click", e=>{ if(e.target===$("envio")) $("envio").hidden = true; });
$("env-copiar").addEventListener("click", ()=>{ copiarTexto($("env-txt").value).then(ok=>{ const a=$("env-aviso"); a.hidden=false; a.className="stat"+(ok?" ok":""); a.textContent = ok ? "✔ Texto copiado. Cole na conversa do WhatsApp." : "Não consegui copiar. Segure o dedo no texto, escolha Selecionar tudo e Copiar."; }); });
$("env-comp").addEventListener("click", ()=>{ try{ navigator.share({text:$("env-txt").value}).catch(()=>{}); }catch(e){} });
$("ordem").value = est.ordem;
$("ordem").addEventListener("change", e=>{ est.ordem=e.target.value; gravarLS("lic_ordem", est.ordem); est.n=POR_PAGINA; desenhar(); });
$("mais").addEventListener("click", ()=>{ est.n+=POR_PAGINA; desenhar(); });

desenhar();
if("serviceWorker" in navigator && location.protocol.indexOf("http")===0){ try{ navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){} }
})();
</script>
</body>
</html>
