name: Atualizar licitações

on:
  schedule:
    # De hora em hora, das 07h às 19h (Brasília), de segunda a sexta. (GitHub usa horário UTC: Brasília + 3h)
    - cron: "7 10-22 * * 1-5"
    # Uma vez por dia no fim de semana (sábado e domingo, 10h de Brasília)
    - cron: "7 13 * * 0,6"
  workflow_dispatch:       # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: atualizar-licitacoes
  cancel-in-progress: false

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Buscar licitações no PNCP
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}     # opcional: avisos no celular
        run: python coletor.py

      - name: Guardar resultado no repositório
        run: |
          git config user.name "coletor-licitacoes"
          git config user.email "actions@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Atualiza licitações ($(date -u +%Y-%m-%dT%H:%MZ))"
          git push

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - id: deployment
        uses: actions/deploy-pages@v4
